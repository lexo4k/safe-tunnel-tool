services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: livrenet-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
      SERVERURL: ${SERVERURL:?Set SERVERURL to the public IP or DNS name of your VPS}
      SERVERPORT: ${SERVERPORT:-51820}
      PEERS: livrenet-android
      PEERDNS: ${PEERDNS:-1.1.1.1}
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: 0.0.0.0/0
      LOG_CONFS: "false"
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${SERVERPORT:-51820}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
